<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 17</title>
</head>
<body>
    <script>
        const contarLetraA = (texto) => {
            let contador = 0;
            for (let i = 0; i < texto.length; i++) 
            {
                if (texto[i] === "a" || texto[i] === "A") 
                {
                    contador++;
                }
            }
            return contador;
        };

        const usuarioTexto = prompt("Ingrese una palabra o frase:");
        const resultado = contarLetraA(usuarioTexto);

        document.write(`La frase "${usuarioTexto}" tiene ${resultado} letras 'a'.`);
    </script>
</body>
</html>
