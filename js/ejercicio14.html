<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 14</title>
</head>
<body>
  <script>
    // Función que duplica los valores de un arreglo
    function duplicar(arreglo) {
      return arreglo.map(num => num * 2);
    }

    let cantidad = parseInt(prompt("¿Cuántos números quieres ingresar?"));
    let numeros = [];

    for (let i = 0; i < cantidad; i++) {
      let num = parseInt(prompt("Ingresa el número " + (i + 1) + ":"));
      numeros.push(num);
    }

    let resultado = duplicar(numeros);
    alert("Arreglo original: " + numeros + "\nArreglo duplicado: " + resultado);
  </script>
</body>
</html>
