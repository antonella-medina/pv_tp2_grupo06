<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let numeros = [];
        let suma = 0;
        const cantidad = parseInt( prompt("Ingrese la cantidad de numeros: "));
        for( let i = 1 ; i <= cantidad ; i++)
        {
            let n= parseInt(prompt ("Ingrese un numero: "+ i + ":"));
            suma += n;
            numeros.push(n);
        }
         const promedio = suma / cantidad;
         document.write(`Los numeros ingresados son: ${numeros} <br> Su promedio es: ${promedio} `);
    </script>
</body>
</html>
