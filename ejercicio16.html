<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 16</title>
</head>
<body>
  <script>
    function sumarRango(inicio, fin) {
      let suma = 0;
      for (let i = inicio; i <= fin; i++) {
        suma += i;
      }
      return suma;
    }

    let inicio = parseInt(prompt("Número inicial:"));
    let fin = parseInt(prompt("Número final:"));

    alert("La suma es: " + sumarRango(inicio, fin));
  </script>
</body>
</html>
