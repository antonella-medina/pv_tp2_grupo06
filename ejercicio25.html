<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 25 - Lucas</title>
    <style>
        body { 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            transition: background-color 0.5s ease; /* Para que el cambio sea suave */
        }
        .btn-principal { 
            padding: 15px 30px; 
            font-size: 1.2rem; 
            cursor: pointer; 
            background: #333; 
            color: white; 
            border: none; 
            border-radius: 50px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-principal:hover { background: #555; }
    </style>
</head>
<body>

    <button id="btn-color" class="btn-principal">Cambiar Color de Fondo</button>

    <script type="module" src="js/ejercicio25.js"></script>
</body>
</html>
