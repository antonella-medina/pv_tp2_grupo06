<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 23 - Lucas</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 40px; background-color: #f8f9fa; }
        .box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #ddd; border-radius: 6px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #007bff; }
        #visor-ej23 { padding: 20px; border-radius: 6px; background-color: #e9ecef; min-height: 30px; word-wrap: break-word; transition: 0.3s; }
    </style>
</head>
<body>
    <div class="box">
        <h3>Contador de Caracteres</h3>
        <p>Escribí más de 20 caracteres para ver la alerta visual:</p>
        <input type="text" id="input-ej23" placeholder="Empezá a escribir...">
        
        <div id="visor-ej23">El texto aparecerá aquí...</div>
    </div>

    <script type="module" src="js/ejercicio23.js"></script>
</body>
</html>
